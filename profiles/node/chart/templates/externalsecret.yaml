{{- if .Values.externalSecrets.env.enabled }}
# Pulls every key at the OpenBao path and turns each one into an env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sb.name" . }}-env
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "sb.name" . }}-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.env.path }}
{{- end }}
---
{{- if .Values.externalSecrets.file.enabled }}
# Renders the keys at the OpenBao path into a single properties file
# mounted at /config, which overrides the defaults baked into the jar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sb.name" . }}-config
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "sb.name" . }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.externalSecrets.file.filename }}: |
          {{ `{{- range $k, $v := . }}` }}
          {{ `{{ $k }}={{ $v }}` }}
          {{ `{{- end }}` }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.file.path }}
{{- end }}

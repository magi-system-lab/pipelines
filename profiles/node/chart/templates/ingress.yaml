{{- if .Values.host }}
# Only created when launch.yml declares "host". Inert until AdGuard
# resolves *.lab.home.arpa to balthazar (phase 2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sb.name" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sb.name" . }}
                port:
                  name: http
{{- end }}

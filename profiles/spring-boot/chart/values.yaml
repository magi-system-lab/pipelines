# Profile defaults. Whatever launch.yml declares is rendered into
# values.generated.yaml and overrides this. Convention lives here:
# memory, probes, user, priority.
app: ""
image: ""
port: 8080
javaOpts: ""
# Convention for every app in the homelab. launch.yml env adds to it or
# overrides it key by key.
env:
  TZ: America/Mexico_City

priorityClass: preview-priority

service:
  # NodePort keeps apps reachable by IP until local DNS exists.
  type: NodePort
  # Optional fixed NodePort (30000-32767), set from launch.yml "node-port".
  nodePort: ""

# Ingress is only created when launch.yml declares "host".
host: ""

# Secrets pulled from OpenBao by External Secrets Operator.
# The pipeline never sees their values.
externalSecrets:
  # Materialised as env vars through envFrom.
  env:
    enabled: false
    path: ""
  # Materialised as a file under /config.
  file:
    enabled: false
    path: ""
    # application.properties or application.yaml
    filename: application.properties
  storeName: openbao

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# TCP probes against the app port: they work without requiring
# spring-boot-actuator, which not every app includes.
probes:
  readinessInitialDelay: 20
  livenessInitialDelay: 60

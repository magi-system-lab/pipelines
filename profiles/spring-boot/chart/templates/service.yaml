apiVersion: v1
kind: Service
metadata:
  name: {{ include "sb.name" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.app }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      {{- if .Values.service.nodePort }}
      # Fixed port for apps whose clients are configured by address, such as an
      # MCP server; otherwise Kubernetes assigns one.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}

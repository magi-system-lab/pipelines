apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sb.name" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app }}
  template:
    metadata:
      labels: {{- include "sb.labels" . | nindent 8 }}
      annotations:
        # Rolls the pod when the image changes. Secret rotation is handled by
        # External Secrets refreshing the Secret in place.
        checksum/image: {{ .Values.image | sha256sum }}
    spec:
      priorityClassName: {{ .Values.priorityClass }}
      containers:
        - name: app
          image: {{ .Values.image }}
          # Images are loaded with "k3s ctr images import": never pulled from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.javaOpts }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.externalSecrets.env.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "sb.name" . }}-env
          {{- end }}
          {{- if .Values.externalSecrets.file.enabled }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelay }}
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelay }}
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.externalSecrets.file.enabled }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "sb.name" . }}-config
      {{- end }}

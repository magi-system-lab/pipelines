{{- if .Values.host }}
# Solo se crea si launch.yml declara "host". Queda listo para cuando
# AdGuard resuelva *.lab.home.arpa hacia balthazar (fase 2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sb.name" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sb.name" . }}
                port:
                  name: http
{{- end }}

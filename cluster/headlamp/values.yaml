# Headlamp: web UI to browse the cluster and follow pod logs.
# Installed with:
#   helm upgrade --install headlamp headlamp/headlamp --version 0.46.0 \
#     --namespace headlamp --create-namespace -f cluster/headlamp/values.yaml
#
# Headlamp itself gets no cluster role. Every request uses the read-only
# headlamp-viewer token (viewer.yaml), which auth-proxy.yaml adds after the
# username and password check. The chart default would bind cluster-admin.

clusterRoleBinding:
  create: false

service:
  # Only reachable inside the cluster: the login lives in auth-proxy.yaml, which
  # serves http://balthazar.local:30800 and adds the token.
  type: ClusterIP

securityContext:
  runAsNonRoot: true
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

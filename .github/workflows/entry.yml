# Central reader and dispatcher. App repos only call this workflow; all the
# logic lives here, so migrating to another forge means changing this file
# and not the repos.
name: entry

on:
  workflow_call:
    secrets:
      # Internal network coordinates. They are not written in the code because
      # this repo has to be public: a public repo cannot consume reusable
      # workflows from a private one. Each app repo defines them and they
      # arrive here through "secrets: inherit".
      CLUSTER_HOST:
        required: true
      CLUSTER_USER:
        required: true

# The job only needs to read code. Declared explicitly instead of inheriting
# whatever the repository default happens to be.
permissions:
  contents: read

env:
  DOMAIN: lab.home.arpa

jobs:
  deploy:
    # Two safety barriers, because the repos are public and the runner lives
    # on the home network:
    #   1. GitHub requires approval for every external contributor.
    #   2. This condition: a pull request from a fork does not match it, so it
    #      cannot run on the Mac even if someone approves it by mistake.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # The builder is chosen by the org variable BUILDER_LABEL: "balthazar"
    # builds on the cluster node itself, anything else (or unset) falls back
    # to the Mac. Switching or rolling back is a one-variable change.
    runs-on: [self-hosted, "${{ vars.BUILDER_LABEL || 'homelab' }}"]
    timeout-minutes: 45

    steps:
      - name: Check out the app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out the profiles
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: magi-system-lab/pipelines
          path: .pipelines
          ref: main

      # macOS denies local network access to non-Apple binaries running under
      # launchd, so kubectl and helm cannot reach the cluster API directly.
      # Apple's ssh can, so we forward the port and talk to 127.0.0.1, which is
      # exactly what the kubeconfig k3s generates already points at, keeping
      # certificate validation intact.
      - name: Open a tunnel to the cluster API
        id: tunnel
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PORT=$(( 7000 + ${{ github.run_id }} % 2000 ))
          KCFG="$RUNNER_TEMP/kubeconfig"

          ssh -i ~/.ssh/id_ed25519_balthazar_ci -o BatchMode=yes \
              "${{ secrets.CLUSTER_USER }}@${{ secrets.CLUSTER_HOST }}" \
              'cat /etc/rancher/k3s/k3s.yaml' > "$KCFG"
          chmod 600 "$KCFG"
          sed -i '' "s#https://127.0.0.1:6443#https://127.0.0.1:$PORT#" "$KCFG"

          ssh -i ~/.ssh/id_ed25519_balthazar_tunnel -o BatchMode=yes \
              -o ExitOnForwardFailure=yes -fN \
              -L "$PORT:127.0.0.1:6443" \
              "${{ secrets.CLUSTER_USER }}@${{ secrets.CLUSTER_HOST }}"

          echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          KUBECONFIG="$KCFG" kubectl version -o json >/dev/null
          echo "tunnel up on 127.0.0.1:$PORT and the API answers"

      # On balthazar the API is local. The runner's kubeconfig belongs to the
      # ci-deployer ServiceAccount, scoped to what the charts need: no nodes,
      # no RBAC, no CRDs, no pods/exec.
      - name: Use the node's local cluster API
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          KUBECONFIG="$HOME/.kube/config" kubectl version -o json >/dev/null
          echo "local API answers as ci-deployer"

      - name: Read launch.yml and decide what to do
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          test -f launch.yml || { echo "::error::this repo has no launch.yml at its root"; exit 1; }

          PROFILE=$(yq -r '.profile' launch.yml)
          # Defaults to the repository name, so most repos do not need to declare it.
          APP=$(yq -r '.app // ""' launch.yml)
          [ -n "$APP" ] || APP=$(echo "$REPO_NAME" | tr '[:upper:]_' '[:lower:]-')
          # A repo that needs a custom image declares its own Containerfile.
          CFILE=$(yq -r '.containerfile // ""' launch.yml)
          # Extra runtime packages, so an app needing more than the base image
          # still does not have to carry its own Containerfile.
          PKGS=$(yq -r '.packages // [] | join(" ")' launch.yml)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ENVNAME=preview
            NS="pr-${{ github.event.pull_request.number }}"
            PRIORITY=preview-priority
            if [ "${{ github.event.action }}" = "closed" ]; then ACTION=delete; else ACTION=deploy; fi
          else
            ENVNAME=prod
            NS=prod
            PRIORITY=prod-priority
            # A push only deploys when its branch is listed in environments.prod.branches
            # Defaults to main.
            BRANCHES=$(yq -r '.environments.prod.branches // ["main"] | join(" ")' launch.yml)
            # REF_NAME comes through the environment, never interpolated into the
            # script body, so a crafted branch name cannot inject shell.
            case " $BRANCHES " in
              *" $REF_NAME "*) ACTION=deploy ;;
              *) ACTION=skip ;;
            esac
          fi

          # Merge rule: maps merge per key, environment scalars win over defaults.
          PORT=$(yq -r ".environments.$ENVNAME.port // .port // 8080" launch.yml)
          JAVA_OPTS=$(yq -r ".environments.$ENVNAME.\"java-opts\" // .\"java-opts\" // \"\"" launch.yml)
          # The JVM sizes its heap at 25% of the container limit by default,
          # 128 MB out of 512 Mi, which is too small for most Spring Boot apps.
          if [ -z "$JAVA_OPTS" ] && [ "$PROFILE" = "spring-boot" ]; then JAVA_OPTS="-XX:MaxRAMPercentage=75"; fi
          # Optional memory limit for apps that need more than the profile default.
          MEMORY=$(yq -r ".environments.$ENVNAME.memory // .memory // \"\"" launch.yml)
          HOSTBASE=$(yq -r ".environments.$ENVNAME.host // .host // \"\"" launch.yml)
          # Per environment only: a fixed port shared by prod and a preview would collide.
          NODEPORT=$(yq -r ".environments.$ENVNAME.\"node-port\" // \"\"" launch.yml)
          HOSTPORT=$(yq -r ".environments.$ENVNAME.\"host-port\" // \"\"" launch.yml)
          yq -o=yaml "(.env // {}) * (.environments.$ENVNAME.env // {})" launch.yml > "$RUNNER_TEMP/env.yaml"

          # Secrets: launch.yml only declares the OpenBao path and the shape.
          # No value ever passes through CI.
          # Convention: OpenBao <environment>/<app>, unless launch.yml says
          # otherwise. Spring Boot apps get it as /config/application.properties
          # (keys are real property names); other profiles as env vars.
          # "secrets: []" opts out, for an environment with no secret.
          SEC_KIND=$(yq -r ".environments.$ENVNAME.secrets | tag" launch.yml)
          if [ "$SEC_KIND" = "!!null" ]; then
            SEC_PATH="$ENVNAME/$APP"
            if [ "$PROFILE" = "spring-boot" ]; then SEC_FORMAT=properties; else SEC_FORMAT=env; fi
          else
            SEC_PATH=$(yq -r ".environments.$ENVNAME.secrets[0].path // \"\"" launch.yml)
            SEC_FORMAT=$(yq -r ".environments.$ENVNAME.secrets[0].format // \"env\"" launch.yml)
          fi

          # launch.yml is untrusted input: validate before anything reaches a shell.
          echo "$PROFILE" | grep -Eq '^(spring-boot|node)$'        || { echo "::error::invalid profile: $PROFILE"; exit 1; }
          echo "$APP"     | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'   || { echo "::error::invalid app name: $APP"; exit 1; }
          echo "$PORT"    | grep -Eq '^[0-9]{2,5}$'                || { echo "::error::invalid port: $PORT"; exit 1; }
          echo "$CFILE"   | grep -Eq '^[A-Za-z0-9._/-]{0,100}$'    || { echo "::error::invalid containerfile path"; exit 1; }
          echo "$PKGS"    | grep -Eq '^[a-z0-9 .+-]{0,200}$'        || { echo "::error::invalid packages list"; exit 1; }
          echo "$SEC_PATH"| grep -Eq '^[a-z0-9/_-]{0,60}$'         || { echo "::error::invalid secret path"; exit 1; }
          echo "$SEC_FORMAT" | grep -Eq '^(env|properties|yaml)$'  || { echo "::error::invalid secret format"; exit 1; }
          echo "$HOSTBASE"| grep -Eq '^[a-z0-9-]{0,40}$'           || { echo "::error::invalid host"; exit 1; }
          echo "$JAVA_OPTS" | grep -Eq '^[A-Za-z0-9 :=+._-]{0,200}$' || { echo "::error::invalid java-opts"; exit 1; }
          if [ -n "$HOSTPORT" ]; then
            # Ports the node already uses or Kubernetes needs stay off limits.
            echo "$HOSTPORT" | grep -Eq '^[1-9][0-9]{0,4}$' && [ "$HOSTPORT" -le 65535 ] \
              && [ "$HOSTPORT" -lt 30000 ] \
              && ! echo " 22 53 80 443 2379 2380 5353 6443 8472 10250 10256 51820 51821 " | grep -q " $HOSTPORT " \
              || { echo "::error::invalid host-port: $HOSTPORT (below 30000, not a port the node uses)"; exit 1; }
          fi
          echo "$MEMORY" | grep -Eq '^([1-9][0-9]{2,3}Mi|[1-4]Gi)?$'   || { echo "::error::invalid memory: $MEMORY (use e.g. 768Mi or 1Gi, up to 4Gi)"; exit 1; }
          if [ -n "$NODEPORT" ]; then
            echo "$NODEPORT" | grep -Eq '^3[0-2][0-9]{3}$' && [ "$NODEPORT" -ge 30000 ] && [ "$NODEPORT" -le 32767 ] \
              || { echo "::error::invalid node-port: $NODEPORT (use 30000-32767)"; exit 1; }
          fi

          HOST=""
          if [ -n "$HOSTBASE" ] && [ "$HOSTBASE" != "null" ]; then
            if [ "$ENVNAME" = "prod" ]; then HOST="$HOSTBASE.${{ env.DOMAIN }}";
            else HOST="$HOSTBASE-$NS.${{ env.DOMAIN }}"; fi
          fi

          TAG="$ENVNAME-$(echo ${{ github.sha }} | cut -c1-7)"
          {
            echo "profile=$PROFILE"
            echo "app=$APP"
            echo "env=$ENVNAME"
            echo "ns=$NS"
            echo "action=$ACTION"
            echo "port=$PORT"
            echo "node_port=$NODEPORT"
            echo "host_port=$HOSTPORT"
            echo "memory=$MEMORY"
            echo "java_opts=$JAVA_OPTS"
            echo "host=$HOST"
            echo "priority=$PRIORITY"
            echo "image=localhost/$APP:$TAG"
            echo "envfile=$RUNNER_TEMP/env.yaml"
            echo "containerfile=$CFILE"
            echo "packages=$PKGS"
            echo "secret_path=$SEC_PATH"
            echo "secret_format=$SEC_FORMAT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Plan"
            echo "- profile: \`$PROFILE\` · app: \`$APP\`"
            echo "- action: \`$ACTION\` in namespace \`$NS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the preview of a closed pull request
        if: steps.plan.outputs.action == 'delete'
        run: |
          kubectl delete namespace "${{ steps.plan.outputs.ns }}" --ignore-not-found --wait=false
          echo "- preview \`${{ steps.plan.outputs.ns }}\` deleted" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the image with Podman
        if: steps.plan.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          CF="${{ steps.plan.outputs.containerfile }}"
          PKGS="${{ steps.plan.outputs.packages }}"
          if [ -n "$CF" ]; then
            echo "using the repo's own Containerfile: $CF"
          else
            CF=".pipelines/profiles/${{ steps.plan.outputs.profile }}/Containerfile"
            echo "using the generic profile Containerfile"
            # Tag the slow-changing stages so the prune after the deploy keeps
            # them: the next build reuses them instead of reinstalling the
            # toolchain and the runtime packages. Re-tagging moves the name, and
            # the stale version becomes untagged and gets pruned.
            case "${{ steps.plan.outputs.profile }}" in
              spring-boot) STAGES="toolchain runtime-base" ;;
              node)        STAGES="deps runtime-base" ;;
            esac
            for STAGE in $STAGES; do
              podman build -q -f "$CF" --target "$STAGE" \
                --build-arg EXTRA_PACKAGES="$PKGS" \
                -t "localhost/cache/${{ steps.plan.outputs.app }}-$STAGE:latest" . >/dev/null
              echo "cache stage ready: $STAGE"
            done
          fi
          podman build -f "$CF" \
            --build-arg EXTRA_PACKAGES="$PKGS" \
            -t "${{ steps.plan.outputs.image }}" .

      - name: Load the image into balthazar's containerd
        if: steps.plan.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          # No registry: the image is streamed straight into k3s containerd,
          # locally on balthazar or over SSH from the Mac. sudo only allows
          # this exact import command.
          if [ "$RUNNER_OS" = "Linux" ]; then
            podman save --format oci-archive "${{ steps.plan.outputs.image }}" \
              | sudo -n /usr/local/bin/k3s ctr images import -
          else
            podman save --format oci-archive "${{ steps.plan.outputs.image }}" \
              | ssh -i ~/.ssh/id_ed25519_balthazar_ci -o BatchMode=yes \
                    "${{ secrets.CLUSTER_USER }}@${{ secrets.CLUSTER_HOST }}" \
                    'sudo -n /usr/local/bin/k3s ctr images import -'
          fi

      # The image lives in the cluster's containerd from here on, so the copy in
      # the builder's store is dead weight. Runs even when an earlier step
      # failed, so a broken deploy does not leave its image behind. Base images
      # and the dependency cache mounts are kept on purpose: they are what makes
      # the next build fast.
      - name: Drop the local copy of the image
        if: always() && steps.plan.outputs.action == 'deploy'
        run: |
          podman rmi "${{ steps.plan.outputs.image }}" 2>/dev/null || true
          podman image prune -f >/dev/null 2>&1 || true
          # Column layout instead of --format: the field names differ between Podman versions.
          echo "builder store now: $(podman system df 2>/dev/null | awk '$1 == "Images" {print $2 " images, " $4}')"

      - name: Prepare the namespace and its resource cap
        if: steps.plan.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          kubectl create namespace "${{ steps.plan.outputs.ns }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Previews get a CPU and memory cap; prod is not capped per namespace.
          # 2Gi of limits leaves room for a 1Gi app to roll over to a new pod.
          if [ "${{ steps.plan.outputs.env }}" = "preview" ]; then
            kubectl -n "${{ steps.plan.outputs.ns }}" create quota preview-quota \
              --hard=requests.cpu=500m,requests.memory=512Mi,limits.memory=2Gi,pods=4 \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy with Helm
        if: steps.plan.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          SEC_PATH="${{ steps.plan.outputs.secret_path }}"
          SEC_FORMAT="${{ steps.plan.outputs.secret_format }}"
          ENV_ENABLED=false; FILE_ENABLED=false; FILENAME=application.properties
          if [ -n "$SEC_PATH" ]; then
            case "$SEC_FORMAT" in
              env)        ENV_ENABLED=true ;;
              properties) FILE_ENABLED=true; FILENAME=application.properties ;;
              yaml)       FILE_ENABLED=true; FILENAME=application.yaml ;;
              *) echo "::error::unknown secret format '$SEC_FORMAT' (use env, properties or yaml)"; exit 1 ;;
            esac
          fi

          # launch.yml becomes chart values; the chart supplies the convention.
          VALUES="$RUNNER_TEMP/values.generated.yaml"
          cat > "$VALUES" <<EOF
          app: "${{ steps.plan.outputs.app }}"
          image: "${{ steps.plan.outputs.image }}"
          port: ${{ steps.plan.outputs.port }}
          javaOpts: "${{ steps.plan.outputs.java_opts }}"
          priorityClass: "${{ steps.plan.outputs.priority }}"
          host: "${{ steps.plan.outputs.host }}"
          service:
            type: NodePort
            nodePort: "${{ steps.plan.outputs.node_port }}"
            hostPort: "${{ steps.plan.outputs.host_port }}"
          externalSecrets:
            storeName: openbao
            env:
              enabled: ${ENV_ENABLED}
              path: "${SEC_PATH}"
            file:
              enabled: ${FILE_ENABLED}
              path: "${SEC_PATH}"
              filename: "${FILENAME}"
          EOF
          yq -i ".env = load(\"${{ steps.plan.outputs.envfile }}\")" "$VALUES"
          # Only the limit: the request stays at the profile default.
          MEMORY="${{ steps.plan.outputs.memory }}"
          if [ -n "$MEMORY" ]; then MEMORY="$MEMORY" yq -i '.resources.limits.memory = strenv(MEMORY)' "$VALUES"; fi

          helm upgrade --install "${{ steps.plan.outputs.app }}" \
            ".pipelines/profiles/${{ steps.plan.outputs.profile }}/chart" \
            --namespace "${{ steps.plan.outputs.ns }}" \
            -f "$VALUES" \
            --wait --timeout 8m

      - name: Deployment summary
        if: steps.plan.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          NS="${{ steps.plan.outputs.ns }}"
          APP="${{ steps.plan.outputs.app }}"
          NODEPORT=$(kubectl -n "$NS" get svc "$APP" -o jsonpath='{.spec.ports[0].nodePort}')
          {
            echo ""
            echo "## ${APP} → ${{ steps.plan.outputs.env }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **URL** | http://${{ secrets.CLUSTER_HOST }}:\$NODEPORT |"
            echo "| Namespace | \`$NS\` |"
            echo "| Image | \`${{ steps.plan.outputs.image }}\` |"
            echo "| Priority | \`${{ steps.plan.outputs.priority }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            if [ -n "${{ steps.plan.outputs.secret_path }}" ]; then
              echo "| Secrets | OpenBao \`${{ steps.plan.outputs.secret_path }}\` as \`${{ steps.plan.outputs.secret_format }}\` |"
            fi
            if [ -n "${{ steps.plan.outputs.host }}" ]; then
              echo "| With local DNS (phase 2) | http://${{ steps.plan.outputs.host }} |"
            fi
            echo ""
            echo "### Pods"
            echo ""
            echo '```'
            kubectl -n "$NS" get pods -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What actually helps on a failure: cluster state lands in the run, so
      # there is no need to go digging on balthazar.
      - name: Diagnostics on failure
        if: failure() && steps.plan.outputs.action == 'deploy'
        run: |
          NS="${{ steps.plan.outputs.ns }}"
          APP="${{ steps.plan.outputs.app }}"
          {
            echo ""
            echo "## Diagnostics"
            echo ""
            echo "### Namespace events"
            echo '```'
            kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -25 || true
            echo '```'
            echo "### External secrets"
            echo '```'
            kubectl -n "$NS" get externalsecrets 2>&1 || true
            echo '```'
            echo "### Pod status"
            echo '```'
            kubectl -n "$NS" describe pods -l app.kubernetes.io/name="$APP" 2>&1 \
              | grep -A12 -E "^(Name:|Status:|Events:)" | head -60 || true
            echo '```'
            echo "### Last lines of the app log"
            echo '```'
            kubectl -n "$NS" logs -l app.kubernetes.io/name="$APP" --tail=50 --all-containers 2>&1 | tail -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the tunnel
        if: always() && steps.tunnel.outputs.port != ''
        run: |
          # Match this run's own local port. A bare "127.0.0.1:6443" pattern
          # would also kill the tunnels of other repos' runners on this host.
          pkill -f "${{ steps.tunnel.outputs.port }}:127.0.0.1:6443" 2>/dev/null || true
          echo "tunnel closed on port ${{ steps.tunnel.outputs.port }}"
